# Disc-like default. Read once by the helper; cold-start after edits.
# 122 percent retains the existing ~63-unit normal font calibration.
font_percent=122
# Position is the native signed step, -10..10; smaller means lower.
position=-8
# Keep the bottom baseline fixed when normal cues change from one to two lines.
# 0 restores original native row selection. Three/four-line behavior is unchanged.
bottom_align=1
