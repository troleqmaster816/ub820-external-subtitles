# UB820 QoL helper settings, read once at start: power-cycle after editing.
# Each [section] is one module. enabled=0 switches a module off.

[log]
enabled=1
# errors, info or debug
level=info
# Saving the log to sub/ub820_submenu.log on this stick (it can also be read
# in OPTIONS > External Subtitles > Helper log):
#   menu    when you pick "Save log to USB" in that menu
#   always  continuously: a few seconds after each change and at once after a
#           crash or hang report. The previous run's log is kept as
#           sub/ub820_submenu.prev.log, so after a freeze or a reboot the log
#           of that run is still there. Leave the stick in the player.
#   off     never
save=menu
# Detailed diagnostics of the player itself, not only of these modules:
# crashes (which program, signal, address, library+offset, stack), threads
# stuck in the kernel or spinning on the CPU, programs starting and ending
# (with exit code or signal), kernel messages, low memory, and a load/memory
# line every minute. Uses a little CPU. Best with save=always.
diagnostics=0

[ui]
# The OPTIONS menus: External Subtitles (while that module is on) and
# UB820 Helper (Blu-ray region, SSH, helper log). Choices made there are saved
# to sub/ub820_menu.cfg on this stick and win over this file.
enabled=1

[external_subtitles]
enabled=1
# Font scale, 90..150. 122 matches the disc look.
font_percent=122
# Native vertical step, -10..10. Lower numbers move text down.
position=-8
# 1 keeps one- and two-line cues on the same bottom line, 0 is stock.
bottom_align=1
# The player's own size, sync, character code and on/off rows in OPTIONS.
native_options=1
# English text for those rows in European menu languages.
english_text=1

[region]
enabled=1
# Region a Blu-ray sees (PSR20), chosen when the disc starts:
#   auto   keep the player's region unless the disc's HDMV program only
#          accepts other regions; then use one it accepts (BD-J discs keep
#          the player's region for now)
#   stock  leave the player alone
#   A, B, C  always use that region   (for a disc locked to another region)
#   ABC    all three at once (works with discs that test a bit mask)
# The same choice is in OPTIONS > UB820 Helper > Blu-ray region; a choice made
# there is saved to sub/ub820_menu.cfg and wins over this line.
bd_region=auto
# DVD region (best effort, RAM only, in the DVD player's own copy of its
# code; the drive keeps its own region and may still refuse an encrypted
# disc from another region):
#   stock  leave the player alone (default)
#   free   never stop a disc with a region error, keep the player's region
#   1..8   no region error, and discs see that region
#   auto   no region error; a disc that excludes the player's region sees
#          the first region it allows
# Also in OPTIONS > UB820 Helper > DVD region (saved to sub/ub820_menu.cfg).
dvd_region=stock

[remote]
enabled=1
# What the remote's Netflix button does:
#   netflix  open Netflix, as usual
#   nothing  do nothing
#   helper   open (and close) the UB820 Helper menu as an overlay, anywhere:
#            home screen, menus, playback
# The same choice is in OPTIONS > UB820 Helper > Netflix button; a choice made
# there is saved to sub/ub820_menu.cfg and wins over this line.
netflix_key=netflix

[ssh]
# On-demand diagnostic SSH server. OFF by default. Set enabled=1, then start it
# from OPTIONS > UB820 Helper > "Start SSH". RAM only; a power
# cycle removes it. Nothing listens until you start it from the menu.
enabled=0
# auth = key (recommended) or password.
#   key:      put your SSH public key in  sub/authorized_keys  on this stick.
#   password: put the password (one line) in  sub/ssh_password  on this stick.
#             Weaker: the password sits in clear text on the stick.
auth=key
# guard = 1 watches ssh sessions: logs every program a session starts and
# ends a session whose programs start themselves over and over (a chain of
# shells can take the whole player down). Diagnostic; costs a little CPU while
# the server runs. 0 (default) = off.
guard=0
# TCP port to listen on.
port=2222
